name: Public privacy and support pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/PRIVACY_POLICY.md'
      - 'docs/SUPPORT.md'
      - 'docs/_config.yml'
      - 'docs/index.md'
      - '.github/workflows/public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build public pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload public pages
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy public pages
        id: deployment
        uses: actions/deploy-pages@v4
