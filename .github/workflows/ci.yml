name: CI

# Nothing gated the repository before this: typecheck, lint, and the test suite
# only ever ran on a developer's machine. The suite is fast (~2s), so there is
# no reason for a pull request to reach `main` unverified.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `--frozen-lockfile` so a drifting bun.lock fails here rather than on an
      # EAS builder. heroui-native-pro's postinstall needs a licensed token it
      # will not have in CI; it exits 0 and leaves a stub, which is fine because
      # nothing here bundles the app — but it must not be allowed to fail the
      # install, hence --ignore-scripts for the Pro packages' fetch step.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Release configuration
        run: bun run release:config

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test:once
